[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "voice-inbox"
version = "0.1.0"
description = "Route speech from a Pebble Index 01 dictation ring to anything you like"
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
keywords = ["pebble", "dictation", "voice", "webhook", "automation"]
classifiers = [
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Home Automation",
]
# No runtime dependencies, on purpose: this runs as a long-lived background
# service on a personal machine, and a dependency tree is a maintenance
# liability there. Everything uses the standard library.
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
voice-inbox = "voice_inbox.server:main"
voice-inbox-routes = "voice_inbox.cli:main"

# Handlers can also ship in their own package by advertising this group:
#
#   [project.entry-points."voice_inbox.handlers"]
#   my-thing = "my_package:handler_fn"

[tool.hatch.build.targets.wheel]
packages = ["src/voice_inbox"]

[tool.pytest.ini_options]
markers = ["integration: needs a real whisper.cpp model (slow)"]
